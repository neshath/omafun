name: Linux desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev desktop-file-utils
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: desktop-file-validate packaging/pixel-forge.desktop
      - run: bash -n packaging/PKGBUILD
      - run: npm run desktop:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-forge-linux-x86_64
          path: src-tauri/target/release/pixel-forge
