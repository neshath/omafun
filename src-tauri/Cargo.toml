[package]
name = "omafun"
version = "0.1.0"
description = "A local retro game creation studio"
authors = ["Omafun contributors"]
edition = "2021"

[lib]
name = "omafun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
